<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Black Aces FC — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#020408;--surface:#080d14;--surface2:#0d1520;--surface3:#111c2d;
  --border:#1a2740;--border2:#243550;
  --accent:#00ff88;--accent-dim:rgba(0,255,136,0.12);
  --red:#ff3d5a;--red-dim:rgba(255,61,90,0.12);
  --blue:#3d8bff;--yellow:#ffd166;--yellow-dim:rgba(255,209,102,0.1);
  --text:#e8f0fe;--muted:#4a6080;--muted2:#7a90b0;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --ticker-h:36px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
.ticker-wrap{width:100%;height:var(--ticker-h);background:var(--surface);border-bottom:1px solid var(--border);overflow:hidden;display:flex;}
.ticker-label{flex-shrink:0;padding:0 14px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--accent);border-right:1px solid var(--border);display:flex;align-items:center;}
.ticker-track{flex:1;overflow:hidden;}
.ticker-inner{display:flex;white-space:nowrap;animation:ticker-scroll 30s linear infinite;}
.ticker-inner:hover{animation-play-state:paused;}
@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 20px;border-right:1px solid var(--border);height:var(--ticker-h);font-family:var(--mono);font-size:11px;}
.ticker-name{font-weight:700;letter-spacing:.05em;color:var(--text);}
.fl{color:var(--accent);font-weight:600;}
.fd{color:var(--red);font-weight:600;}

nav{display:flex;align-items:center;padding:0 24px;height:60px;border-bottom:1px solid var(--border);background:var(--surface);gap:16px;}
.nav-logo{display:flex;align-items:center;gap:12px;margin-right:auto;}
.logo-badge{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#1a3a6a,#0d5c3a);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);}
.nav-title{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;}
.nav-sub{font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:1px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted2);}
.nav-tab{padding:6px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;color:var(--muted2);background:none;transition:all .2s;}
.nav-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

main{padding:20px 24px;max-width:1400px;margin:0 auto;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sc-label{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.sc-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent);line-height:1;}
.sc-sub{font-size:11px;color:var(--muted2);margin-top:6px;}
.sc.red .sc-val{color:var(--red);}
.sc.muted .sc-val{color:var(--muted2);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.col-stack{display:flex;flex-direction:column;gap:12px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.phdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.ptitle{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);}
.pbadge{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;}
.pbadge.g{background:var(--accent-dim);color:var(--accent);}
.pbadge.r{background:var(--red-dim);color:var(--red);}

.lb-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);transition:background .15s;}
.lb-row:last-child{border-bottom:none;}
.lb-row:hover{background:var(--surface2);}
.lb-rank{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0;background:var(--surface2);color:var(--muted2);}
.lb-rank.g{background:rgba(255,209,102,.15);color:var(--yellow);}
.lb-rank.s{background:rgba(180,180,200,.1);color:#b4b4c8;}
.lb-rank.b{background:rgba(180,120,60,.1);color:#c89060;}
.lb-info{flex:1;min-width:0;}
.lb-name{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:6px;}
.lb-meta{font-size:10px;color:var(--muted);margin-top:2px;}
.lb-right{text-align:right;flex-shrink:0;}
.lb-score{font-family:var(--mono);font-size:16px;font-weight:700;}
.lb-score.up{color:var(--accent);}
.lb-bar-w{width:60px;height:3px;background:var(--border);border-radius:2px;margin-top:4px;margin-left:auto;}
.lb-bar{height:100%;border-radius:2px;background:var(--accent);}
.pos-pill{font-size:9px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:3px;background:var(--surface2);}

.vote-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;}
.vc{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 10px;border-radius:5px;letter-spacing:.05em;}
.vc.voted{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,255,136,.3);}
.vc.pending{background:var(--surface2);color:var(--muted2);border:1px solid var(--border);}

.view{display:none;}
.view.active{display:block;}

/* Analytics */
.analytics-tabs{display:flex;border-bottom:1px solid var(--border);}
.atab{flex:1;padding:10px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;}
.atab.active{color:var(--accent);border-bottom-color:var(--accent);}
.apanel{display:none;padding:12px 16px;}
.apanel.active{display:block;}

.form-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.form-row:last-child{border-bottom:none;}
.form-name{font-family:var(--mono);font-size:12px;font-weight:600;}
.form-delta{font-family:var(--mono);font-size:11px;font-weight:600;}
.hot{color:var(--accent);}
.cold{color:var(--red);}
.neutral{color:var(--muted2);}

.improved-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
.improved-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.improved-name{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:2px;}
.improved-sub{font-size:11px;color:var(--muted2);}
.improved-divider{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.improved-stat{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;}
.improved-stat-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);}
.improved-stat-label{font-size:9px;color:var(--muted);margin-top:2px;}

.team-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.team-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.team-box-name{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.team-box-avg{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--accent);}
.team-box-sub{font-size:10px;color:var(--muted2);margin-top:4px;}
.team-winner{border-color:var(--accent);}

.voter-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);}
.voter-row:last-child{border-bottom:none;}
.voter-name{font-family:var(--mono);font-size:11px;font-weight:600;}
.voter-bar-wrap{flex:1;margin:0 10px;height:4px;background:var(--border);border-radius:2px;}
.voter-bar-fill{height:100%;border-radius:2px;background:var(--accent);}
.voter-pct{font-family:var(--mono);font-size:10px;color:var(--muted2);min-width:28px;text-align:right;}

/* All time */
.at-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.at-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.at-card-label{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.at-card-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);}
.at-card-sub{font-size:11px;color:var(--muted2);margin-top:4px;}

.games-list{display:flex;flex-direction:column;gap:4px;padding:12px 16px;}
.game-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);}
.game-wk{font-family:var(--mono);font-size:10px;color:var(--muted2);}
.game-result{font-family:var(--mono);font-size:10px;font-weight:700;}
.game-result.win{color:var(--accent);}
.game-result.loss{color:var(--red);}
.game-result.draw{color:var(--yellow);}
.game-voters{font-family:var(--mono);font-size:10px;color:var(--muted);}
</style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker-label">BA·LIVE</div>
  <div class="ticker-track"><div class="ticker-inner" id="tickerInner"></div></div>
</div>

<nav>
  <div class="nav-logo">
    <div class="logo-badge">BA</div>
    <div>
      <div class="nav-title">Black Aces FC</div>
      <div class="nav-sub">Player Ratings Exchange</div>
    </div>
  </div>
  <div class="live-dot"></div>
  <div class="clock" id="clockEl"></div>
  <button class="nav-tab active" onclick="showView('weekly',this)">This Week</button>
  <button class="nav-tab" onclick="showView('alltime',this)">All Time</button>
  <button class="nav-tab" onclick="showView('audit',this)">Audit</button>
</nav>

<main>
  <!-- THIS WEEK -->
  <div class="view active" id="view-weekly">
    <div class="stat-row" id="wStats"></div>
    <div class="g2">
      <div class="panel">
        <div class="phdr"><div class="ptitle">⭐ Weekly Performance Index</div><div class="pbadge g" id="wkLabel">—</div></div>
        <div class="pbody np" id="wLb"></div>
      </div>
      <div class="col-stack">
        <div class="panel">
          <div class="phdr"><div class="ptitle">📊 Analytics</div></div>
          <div class="analytics-tabs">
            <div class="atab active" onclick="showAnalytics('form',this)">Form</div>
            <div class="atab" onclick="showAnalytics('teams',this)">Teams</div>
            <div class="atab" onclick="showAnalytics('voters',this)">Voters</div>
          </div>
          <div class="apanel active" id="apanel-form"></div>
          <div class="apanel" id="apanel-teams"></div>
          <div class="apanel" id="apanel-voters"></div>
        </div>
        <div class="panel">
          <div class="phdr"><div class="ptitle">🗳️ Vote Tracker</div><div class="pbadge r" id="vtBadge">0/0</div></div>
          <div id="vChips"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ALL TIME -->
  <div class="view" id="view-alltime">
    <div class="at-grid" id="atStats"></div>
    <div class="g2">
      <div class="panel">
        <div class="phdr"><div class="ptitle">🏆 All-Time Leaderboard</div></div>
        <div class="pbody np" id="atLb"></div>
      </div>
      <div class="panel">
        <div class="phdr"><div class="ptitle">📅 Recent Games</div></div>
        <div class="games-list" id="recentGames"></div>
      </div>
    </div>
  </div>

  <!-- AUDIT -->
  <div class="view" id="view-audit">
    <div class="g2">
      <div class="panel">
        <div class="phdr"><div class="ptitle">⚠️ Flagged Votes</div><div class="pbadge g" id="flagCount">0 flags</div></div>
        <div id="flagsList"><div style="padding:20px 15px;font-family:var(--mono);font-size:11px;color:var(--muted)">No flags detected.</div></div>
      </div>
      <div class="panel">
        <div class="phdr"><div class="ptitle">🗒️ Audit Log</div></div>
        <div id="auditLog"><div style="padding:20px 15px;font-family:var(--mono);font-size:11px;color:var(--muted)">No audit entries yet.</div></div>
      </div>
    </div>
  </div>
</main>

<script>
const SCRIPT_URL = "https://summer-darkness-e6f1.gokhaleshar.workers.dev";
let PLAYERS = [];
let ALL_DATA = {};
const POS_COL = { GK:"#ffd166", DEF:"#3d8bff", MID:"#00ff88", FWD:"#ff3d5a" };

function clock(){
  document.getElementById("clockEl").textContent =
    new Date().toLocaleTimeString("en-IN",{hour12:false,timeZone:"Asia/Kolkata"})+" IST";
}
setInterval(clock,1000); clock();

function showView(id, btn){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("view-"+id).classList.add("active");
  btn.classList.add("active");
}

function showAnalytics(id, tab){
  document.querySelectorAll(".atab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".apanel").forEach(p=>p.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById("apanel-"+id).classList.add("active");
}

async function loadData(){
  try {
    const playersRes = await fetch(SCRIPT_URL + "?action=players");
    const playersData = await playersRes.json();
    PLAYERS = playersData.players || [];

    const res = await fetch(SCRIPT_URL);
    const weekly = await res.json();
    const allTimeRes = await fetch(SCRIPT_URL + "?action=alltime");
    const allTime = await allTimeRes.json();
    const auditRes = await fetch(SCRIPT_URL + "?action=audit");
    const audit = await auditRes.json();
    const teamsRes = await fetch(SCRIPT_URL + "?action=teams");
    const teams = await teamsRes.json();

    ALL_DATA = { weekly, allTime, audit, teams };
    renderWeekly(weekly, teams, allTime);
    renderAllTime(allTime);
    renderAudit(audit);
    buildTicker(allTime && allTime.players);
  } catch(e) {
    console.error("Dashboard load failed:", e);
    renderEmpty();
  }
}

function renderEmpty(){
  document.getElementById("wStats").innerHTML = `
    <div class="sc"><div class="sc-label">Votes Cast</div><div class="sc-val">0/0</div><div class="sc-sub">no votes yet</div></div>
    <div class="sc"><div class="sc-label">Avg Rating</div><div class="sc-val">—</div><div class="sc-sub">no data</div></div>
    <div class="sc"><div class="sc-label">MVP This Week</div><div class="sc-val" style="font-size:16px">—</div><div class="sc-sub">no data</div></div>
    <div class="sc muted"><div class="sc-label">Result</div><div class="sc-val">—</div><div class="sc-sub">no data</div></div>`;
}

function renderWeekly(d, teamsData, allTime){
  if (!d) { renderEmpty(); return; }
  document.getElementById("wkLabel").textContent = d.weekKey || "—";
  const top = d.players && d.players[0];
  const avgRating = d.players && d.players.length
    ? (d.players.reduce((s,p)=>s+p.avg,0)/d.players.length) : null;
  const resultColor = d.matchResult === "Win" ? "" : d.matchResult === "Loss" ? "red" : "";
  document.getElementById("wStats").innerHTML = `
    <div class="sc" style="animation-delay:0s"><div class="sc-label">Votes Cast</div><div class="sc-val">${d.totalVoters}/${d.expectedVoters}</div><div class="sc-sub">${d.expectedVoters?Math.round(d.totalVoters/d.expectedVoters*100):0}% done</div></div>
    <div class="sc" style="animation-delay:.05s"><div class="sc-label">Avg Rating</div><div class="sc-val">${avgRating?avgRating.toFixed(1):"—"}</div><div class="sc-sub">out of 5.0</div></div>
    <div class="sc" style="animation-delay:.1s"><div class="sc-label">MVP This Week</div><div class="sc-val" style="font-size:16px">${top?top.name:"—"}</div><div class="sc-sub">${top?top.avg.toFixed(1)+" ⭐":"no data"}</div></div>
    <div class="sc ${resultColor}" style="animation-delay:.15s"><div class="sc-label">Result</div><div class="sc-val" style="font-size:18px">${d.matchResult==="Win"?"WIN":d.matchResult==="Loss"?"LOSS":d.matchResult==="Draw"?"DRAW":"—"}</div><div class="sc-sub">this week</div></div>`;

  const medals = ["🥇","🥈","🥉"];
  document.getElementById("wLb").innerHTML = d.players && d.players.length
    ? d.players.map((p,i) => `<div class="lb-row" style="animation-delay:${i*.06}s">
        <div class="lb-rank ${i===0?"g":i===1?"s":i===2?"b":""}">${medals[i]||i+1}</div>
        <div class="lb-info">
          <div class="lb-name">${p.name}<span class="pos-pill" style="color:${POS_COL[PLAYERS.find(x=>x.name===p.name)?.pos]||"#fff"}">${PLAYERS.find(x=>x.name===p.name)?.pos||""}</span></div>
          <div class="lb-meta">${p.count} votes</div>
        </div>
        <div class="lb-right">
          <div class="lb-score up">${p.avg.toFixed(1)}</div>
          <div class="lb-bar-w"><div class="lb-bar" style="width:${p.avg/5*100}%"></div></div>
        </div>
      </div>`).join("")
    : `<div style="padding:30px 15px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)">No votes yet.</div>`;

  const votedSet = new Set(d.voters||[]);
  document.getElementById("vChips").innerHTML = `<div class="vote-chips">${PLAYERS.map(p=>`<span class="vc ${votedSet.has(p.name)?"voted":"pending"}">${votedSet.has(p.name)?"✓ ":""}${p.name}</span>`).join("")}</div>`;
  document.getElementById("vtBadge").textContent = `${d.totalVoters}/${d.expectedVoters}`;
  document.getElementById("vtBadge").className = `pbadge ${d.totalVoters===d.expectedVoters?"g":"r"}`;

  renderAnalytics(d, teamsData, allTime);
}

function renderAnalytics(weekly, teamsData, allTime){
  const players = allTime && allTime.players ? allTime.players : [];

  // FORM tab — Hot/Cold + Most Improved
  const withDelta = players.filter(p => p.delta !== 0);
  const mostImproved = [...players].sort((a,b) => b.delta - a.delta)[0];
  const mostDeclined = [...players].sort((a,b) => a.delta - b.delta)[0];
  const sorted = [...players].sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));

  let formHtml = "";

  if (mostImproved && mostImproved.delta > 0) {
    formHtml += `
      <div class="improved-card">
        <div class="improved-label">🔥 Most Improved</div>
        <div class="improved-name">${mostImproved.name}</div>
        <div class="improved-sub">Biggest positive jump this week</div>
        <div class="improved-divider">
          <div class="improved-stat"><div class="improved-stat-val" style="color:var(--accent)">+${mostImproved.delta.toFixed(2)}</div><div class="improved-stat-label">Delta</div></div>
          <div class="improved-stat"><div class="improved-stat-val">${mostImproved.avg.toFixed(2)}</div><div class="improved-stat-label">Current Avg</div></div>
        </div>
      </div>`;
  }

  if (mostDeclined && mostDeclined.delta < 0) {
    formHtml += `
      <div class="improved-card" style="border-color:rgba(255,61,90,.3)">
        <div class="improved-label" style="color:var(--red)">📉 Biggest Drop</div>
        <div class="improved-name" style="color:var(--red)">${mostDeclined.name}</div>
        <div class="improved-sub">Biggest negative change this week</div>
        <div class="improved-divider">
          <div class="improved-stat"><div class="improved-stat-val" style="color:var(--red)">${mostDeclined.delta.toFixed(2)}</div><div class="improved-stat-label">Delta</div></div>
          <div class="improved-stat"><div class="improved-stat-val">${mostDeclined.avg.toFixed(2)}</div><div class="improved-stat-label">Current Avg</div></div>
        </div>
      </div>`;
  }

  formHtml += sorted.length
    ? sorted.slice(0,6).map(p => {
        const cls = p.delta > 0.2 ? "hot" : p.delta < -0.2 ? "cold" : "neutral";
        const arrow = p.delta > 0.2 ? "↑" : p.delta < -0.2 ? "↓" : "→";
        const label = p.delta > 0.2 ? "Hot" : p.delta < -0.2 ? "Cold" : "Stable";
        return `<div class="form-row">
          <span class="form-name">${p.name}</span>
          <span class="form-delta ${cls}">${arrow} ${label} (${p.delta>0?"+":""}${p.delta.toFixed(2)})</span>
        </div>`;
      }).join("")
    : `<div style="color:var(--muted);font-size:11px;font-family:var(--mono);padding:8px 0">Need 2+ weeks of data for form guide</div>`;

  document.getElementById("apanel-form").innerHTML = formHtml;

  // TEAMS tab
  if (teamsData && teamsData.teams && weekly.players && weekly.players.length) {
    const teamA = Array.isArray(teamsData.teams.teamA) ? teamsData.teams.teamA : teamsData.teams.teamA.split(",").map(n=>n.trim());
    const teamB = Array.isArray(teamsData.teams.teamB) ? teamsData.teams.teamB : teamsData.teams.teamB.split(",").map(n=>n.trim());
    const getAvg = (team) => {
      const rated = weekly.players.filter(p => team.includes(p.name));
      return rated.length ? +(rated.reduce((s,p)=>s+p.avg,0)/rated.length).toFixed(2) : null;
    };
    const avgA = getAvg(teamA);
    const avgB = getAvg(teamB);
    const aWins = avgA && avgB ? avgA > avgB : false;
    const bWins = avgA && avgB ? avgB > avgA : false;
    document.getElementById("apanel-teams").innerHTML = `
      <div class="team-compare">
        <div class="team-box ${aWins?"team-winner":""}">
          <div class="team-box-name">${teamsData.teams.teamAName||"Team A"}</div>
          <div class="team-box-avg">${avgA !== null ? avgA : "—"}</div>
          <div class="team-box-sub">${aWins?"⭐ Higher rated":""} avg rating</div>
        </div>
        <div class="team-box ${bWins?"team-winner":""}">
          <div class="team-box-name">${teamsData.teams.teamBName||"Team B"}</div>
          <div class="team-box-avg">${avgB !== null ? avgB : "—"}</div>
          <div class="team-box-sub">${bWins?"⭐ Higher rated":""} avg rating</div>
        </div>
      </div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted)">Based on this week's votes</div>`;
  } else {
    document.getElementById("apanel-teams").innerHTML = `<div style="color:var(--muted);font-size:11px;font-family:var(--mono);padding:8px 0">Paste teams in Telegram first</div>`;
  }

  // VOTERS tab
  const totalGames = allTime && allTime.recentGames ? Math.max(allTime.recentGames.length, 1) : 1;
  const voteMap = {};
  if (ALL_DATA.audit && ALL_DATA.audit.auditLog) {
    ALL_DATA.audit.auditLog.filter(e => e.event === "VoteReceived").forEach(e => {
      const voter = e.detail.split(" rated")[0];
      if (!voteMap[voter]) voteMap[voter] = 0;
      voteMap[voter]++;
    });
  }
  const votersSorted = PLAYERS.map(p => ({
    name: p.name,
    votes: voteMap[p.name] || 0,
    pct: Math.min(Math.round(((voteMap[p.name]||0)/totalGames)*100), 100)
  })).sort((a,b) => b.pct - a.pct);

  document.getElementById("apanel-voters").innerHTML = votersSorted.map(p => `
    <div class="voter-row">
      <span class="voter-name">${p.name}</span>
      <div class="voter-bar-wrap"><div class="voter-bar-fill" style="width:${p.pct}%"></div></div>
      <span class="voter-pct">${p.pct}%</span>
    </div>`).join("");
}

function renderAllTime(d){
  if (!d || !d.players || !d.players.length) return;
  const top = d.players[0];
  const totalGames = d.recentGames ? d.recentGames.length : 0;
  const wins = d.recentGames ? d.recentGames.filter(g=>g.result==="Win").length : 0;
  const mostImproved = [...d.players].filter(p=>p.delta>0).sort((a,b)=>b.delta-a.delta)[0];
  document.getElementById("atStats").innerHTML = `
    <div class="at-card"><div class="at-card-label">All-Time MVP</div><div class="at-card-val">${top.name}</div><div class="at-card-sub">${top.avg} avg ⭐</div></div>
    <div class="at-card"><div class="at-card-label">Games Tracked</div><div class="at-card-val">${totalGames}</div><div class="at-card-sub">this season</div></div>
    <div class="at-card"><div class="at-card-label">Win Rate</div><div class="at-card-val">${totalGames?Math.round(wins/totalGames*100):0}%</div><div class="at-card-sub">${wins} wins of ${totalGames}</div></div>
    <div class="at-card"><div class="at-card-label">Most Improved</div><div class="at-card-val" style="font-size:16px">${mostImproved?mostImproved.name:"—"}</div><div class="at-card-sub">${mostImproved?"+"+mostImproved.delta.toFixed(2)+" this week":"need 2+ weeks"}</div></div>`;

  const medals = ["🥇","🥈","🥉"];
  document.getElementById("atLb").innerHTML = d.players.map((p,i) => {
    const deltaStr = p.delta > 0
      ? `<span style="color:var(--accent)">+${p.delta}</span>`
      : p.delta < 0
      ? `<span style="color:var(--red)">${p.delta}</span>`
      : `<span style="color:var(--muted)">—</span>`;
    return `<div class="lb-row">
      <div class="lb-rank ${i===0?"g":i===1?"s":i===2?"b":""}">${medals[i]||i+1}</div>
      <div class="lb-info">
        <div class="lb-name">${p.name}<span class="pos-pill" style="color:${POS_COL[PLAYERS.find(x=>x.name===p.name)?.pos]||"#fff"}">${PLAYERS.find(x=>x.name===p.name)?.pos||""}</span></div>
        <div class="lb-meta">${p.gamesPlayed} games · ${p.count} ratings · trend ${deltaStr}</div>
      </div>
      <div class="lb-right">
        <div class="lb-score up">${p.avg.toFixed(1)}</div>
        <div class="lb-bar-w"><div class="lb-bar" style="width:${p.avg/5*100}%"></div></div>
      </div>
    </div>`;
  }).join("");

  if (d.recentGames) {
    document.getElementById("recentGames").innerHTML = d.recentGames.map(g => {
      const cls = g.result==="Win"?"win":g.result==="Loss"?"loss":"draw";
      const label = g.result==="Win"?"WIN":g.result==="Loss"?"LOSS":g.result==="Draw"?"DRAW":"—";
      return `<div class="game-row">
        <span class="game-wk">${g.weekKey}</span>
        <span class="game-result ${cls}">${label}</span>
        <span class="game-voters">${g.voters} voters</span>
      </div>`;
    }).join("");
  }
}

function renderAudit(d){
  if (!d) return;
  if (d.flaggedVotes && d.flaggedVotes.length) {
    document.getElementById("flagCount").textContent = d.flaggedVotes.length + " flags";
    document.getElementById("flagCount").className = "pbadge r";
    document.getElementById("flagsList").innerHTML = `<div style="padding:12px 16px">${d.flaggedVotes.map(f=>`<div style="font-family:var(--mono);font-size:11px;padding:6px 0;border-bottom:1px solid var(--border);color:var(--red)">${f.voter} — avg ${f.avg} (${f.weekKey})</div>`).join("")}</div>`;
  }
  if (d.auditLog && d.auditLog.length) {
    document.getElementById("auditLog").innerHTML = `<div style="padding:12px 16px">${d.auditLog.slice(-20).reverse().map(e=>`<div style="font-family:var(--mono);font-size:10px;padding:5px 0;border-bottom:1px solid var(--border);color:var(--muted2)"><span style="color:var(--accent)">${e.event}</span> · ${e.detail} · <span style="color:var(--muted)">${e.weekKey}</span></div>`).join("")}</div>`;
  }
}

function buildTicker(players){
  if (!players || !players.length) {
    document.getElementById("tickerInner").innerHTML = '<div class="ticker-item"><span class="ticker-name">No data yet</span></div>';
    return;
  }
  const items = players.map(p => `<div class="ticker-item">
    <span class="ticker-name">${p.name.toUpperCase()}</span>
    <span class="${p.delta>=0?"fl":"fd"}">${p.avg.toFixed(2)}</span>
    <span style="font-size:10px" class="${p.delta>0?"fl":p.delta<0?"fd":"neutral"}">${p.delta>0?"+":""}${p.delta.toFixed(2)}</span>
  </div>`).join("");
  document.getElementById("tickerInner").innerHTML = items + items;
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
